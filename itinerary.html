<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Itinerary - Explore Uganda</title>
    <meta name="description"
        content="Explore Uganda's top tourist attractions, cultural sites, and nature experiences in Kampala and beyond.">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <div class="logo">
            <!-- SVG Compass Logo -->
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Green Outer Circle -->
                <circle cx="50" cy="50" r="45" fill="#1B5E20" />
                <!-- Sand Inner Circle -->
                <circle cx="50" cy="50" r="32" fill="#FFF8E1" />
                <!-- Orange Needle (North) -->
                <polygon points="50,15 62,50 50,50" fill="#FF8F00" />
                <!-- Dark Green Needle (South) -->
                <polygon points="50,85 38,50 50,50" fill="#1B5E20" />
                <!-- Center Pin -->
                <circle cx="50" cy="50" r="4" fill="#212121" />
            </svg>
            <h1>Explore Uganda</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#attractions">Attractions</a></li>
                <li><a href="favorites.html">Favorites ❤️</a></li>
                <li><a href="itinerary.html">My Trip 🗺️</a></li>
            </ul>
        </nav>
        <button class="sign-in-btn">Sign In</button>
    </header>

    <main class="listing-container" style="grid-template-columns: 2fr 1fr;">
        <!-- Left Side: Trip List -->
        <section class="results-area">
            <div class="results-header">
                <h2>My Trip Plan</h2>
                <p id="trip-count">Loading...</p>
            </div>
            <div id="itinerary-list" class="grid-container" style="grid-template-columns: 1fr;">
                <!-- Trip items will appear here -->
            </div>
        </section>

        <!-- Right Side: Summary & Export -->
        <aside class="filters-sidebar">
            <h3>Trip Summary</h3>
            <div class="filter-group">
                <p><strong>Total Attractions:</strong> <span id="total-attractions">0</span></p>
                <p><strong>Estimated Cost:</strong> $<span id="total-cost">0</span> USD</p>
                <p style="font-size: 0.85rem; color: #666;">*Based on entry fees per person</p>
            </div>

            <button id="export-btn" class="book-btn" style="margin-top: 1rem;">Export Itinerary 📄</button>
            <button id="clear-trip-btn" class="reset-btn" style="margin-top: 0.5rem; background: #ffcccc;">Clear
                Trip</button>
        </aside>
    </main>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 Kampala Tourism. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/itinerary.js" type="module"></script>
</body>

</html>
